name: Domaining Scan (Free)

on:
  schedule:
    - cron: "0 7 * * *"   # tous les jours à 07:00 UTC
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m src.jobs.scan_periodic \
            --rules configs/rules.yaml \
            --niches configs/niches.yaml \
            --infile data/expired.csv \
            --out reports/scan.csv
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: domaining-report
          path: reports/scan.csv
